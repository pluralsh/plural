services:
  db:
    image: postgres:14
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - database_data:/var/lib/postgresql/data
  cloud:
    image: postgres:14
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - cld_db_data:/var/lib/postgresql/data
  rabbit:
    image: rabbitmq:3-management
    hostname: "rabbit1"
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
      RABBITMQ_DEFAULT_USER: "rabbitmq"
      RABBITMQ_DEFAULT_PASS: "rabbitmq"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "15672:15672"
      - "5672:5672"
  influxdb:
    image: influxdb:1.8
    volumes:
      # Mount for influxdb data directory and configuration
      - influxdb:/var/lib/influxdb
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_ADMIN_USER=forge
      - INFLUXDB_ADMIN_PASSWORD=forgepwd
      - INFLUXDB_DB=plural
    ports:
      - "8086:8086"
  chartmuseum:
    image: ghcr.io/helm/chartmuseum:v0.16.6
    restart: always
    user: "0:0"
    environment:
      PORT: 8080
      DEPTH: 1
      STORAGE: local
      STORAGE_LOCAL_ROOTDIR: /charts
      CONTEXT_PATH: /cm
    volumes:
      - chartmuseum_data:/charts
    ports:
      - "8080:8080"
  backend-test:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.test
    working_dir: /app
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    environment:
      MIX_ENV: test
      DB_HOST: db
      RABBITMQ_HOST: rabbit
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PASSWORD: rabbitmq
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      CLOUD_DB_HOST: cloud
      CHARTMUSEUM_URL: http://chartmuseum:8080
    depends_on:
      - db
      - cloud
      - rabbit
      - influxdb
      - chartmuseum
    entrypoint:
      - "/bin/sh"
      - "-c"
    command: ${BACKEND_TEST_CMD:-"mix deps.get && mix compile"}
volumes:
  database_data:
    driver: local
  cld_db_data:
    driver: local
  influxdb:
    driver: local
  chartmuseum_data:
    driver: local
  mix_deps:
    driver: local
  mix_build:
    driver: local